[workspace]
resolver = "2"
members = [
    "crates/peregrine-core",
    "crates/peregrine-store",
    "crates/peregrine-crypto",
    "crates/peregrine-dst",
    "crates/peregrine-ui-core",
    "crates/peregrine-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/WyattAu/peregrine"
rust-version = "1.97.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Escapes allowed only in tests and at documented INVARIANT sites.
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "warn"
print_stderr = "warn"
print_stdout = "warn"

[workspace.dependencies]
peregrine-core = { path = "crates/peregrine-core", version = "0.1.0" }
peregrine-store = { path = "crates/peregrine-store", version = "0.1.0" }
peregrine-crypto = { path = "crates/peregrine-crypto", version = "0.1.0" }
peregrine-dst = { path = "crates/peregrine-dst", version = "0.1.0" }
peregrine-ui-core = { path = "crates/peregrine-ui-core", version = "0.1.0" }

# Protocol substrate (phase 1): rustls (aws-lc-rs) transport, E2EE via
# vodozemac, SYSTEM sqlite (the bundled variant ships an affected SQLite C
# copy: RUSTSEC-2026-0459; system-linked builds are exempt per the
# advisory). CI installs libsqlite3-dev; kestrel pattern.
matrix-sdk = { version = "0.19", default-features = false, features = [
    "rustls-aws-lc-rs",
    "e2e-encryption",
    "sqlite",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2"
futures-util = "0.3"
# TUI frontend stack: ratatui re-exports crossterm, so there is no direct
# crossterm dependency (version unification is then guaranteed by lock).
ratatui = { version = "0.29", default-features = true }

[profile.release]
lto = "thin"
codegen-units = 1
