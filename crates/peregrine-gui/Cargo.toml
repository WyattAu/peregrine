[package]
name = "peregrine-gui"
description = "Peregrine desktop GUI shell (phase 2): Slint spike per ADR 0001"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/WyattAu/peregrine"
rust-version = "1.97.0"

# Standalone lockfile; see the STANDALONE note below.
[workspace]

# STANDALONE (not a workspace member): ratatui 0.29 — present in the main
# workspace via peregrine-tui — pins unicode-width "=0.2.0", a yanked
# crates.io release, which cannot coexist with slint's annotate-snippets
# (^0.12.9 -> ^0.2.2) in one resolution graph. This crate keeps its own
# lockfile until ratatui relaxes the pin. See docs/adr/0001 + ROADMAP.

[dependencies]
slint = "1.19"
# Phase-2 core wiring (ADR 0001): same protocol substrate as the TUI.
peregrine-core = { path = "../peregrine-core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Desktop notifications over the freedesktop Notifications D-Bus API
# (KDE plasmashell). zbus stack shares slint's existing zvariant deps.
notify-rust = { version = "4", default-features = false, features = ["z"] }
# System tray (StatusNotifierItem via libappindicator; dlopen'd at
# runtime — the installed libappindicator3.so.1 is found, no ayatana
# package required).
tray-icon = "0.19"

[build-dependencies]
slint-build = "1.19"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
print_stdout = "allow"
print_stderr = "allow"
