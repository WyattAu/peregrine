  <!-- falcon head: sweeping profile with beak -->
  <path d="M 30 88
           C 28 62, 40 40, 62 34
           C 78 29, 96 32, 104 44
           L 100 50
           C 108 52, 112 56, 114 62
           C 104 60, 96 60, 90 62
           C 78 66, 60 66, 46 60
           C 42 70, 40 80, 42 88
           Z"
        fill="#1b8cf0"/>
